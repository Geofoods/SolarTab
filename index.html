<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SolarTab — New Tab</title>
    <meta name="description" content="SolarTab — a custom new tab page featuring NASA's Astronomy Picture of the Day." />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div class="bg" id="bg" role="presentation"></div>
      <div class="overlay"></div>

      <header class="topbar">
        <div class="today" id="today">loading...</div>
      </header>

      <main class="stage">
        <h1 class="clock" id="clock">--:--:--</h1>

        <div class="search-wrap">
          <form class="search" id="search-form" role="search">
            <select id="search-engine" aria-label="Search engine" title="Search engine">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="duckduckgo">DuckDuckGo</option>
            </select>
            <input id="search-input" type="search" placeholder="Search the web..." autocomplete="off" />
            <button type="submit" aria-label="Search">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
            </button>
          </form>
          <div class="suggest" id="suggest" hidden></div>
        </div>

        <button class="lucky" id="lucky-btn" type="button" title="I'm Feeling Lucky">I'm Feeling Lucky</button>

        <nav class="links" id="quick-links" aria-label="Quick links"></nav>
      </main>

      <footer class="apod">
        <div class="apod-card">
          <div class="apod-head">
            <h2 class="apod-title" id="apod-title">loading...</h2>
            <button class="fav" id="fav-btn" title="Save to favorites" aria-label="Save to favorites">☆</button>
          </div>
          <p class="apod-explanation" id="apod-explanation"></p>
          <button class="more" id="explain-toggle" hidden>read more</button>
          <div class="apod-media" id="apod-media"></div>
          <div class="apod-actions">
            <button class="action" id="prev-btn" title="Previous day">←</button>
            <input type="date" id="date-input" min="1995-06-16" aria-label="Pick a date" />
            <button class="action" id="next-btn" title="Next day">→</button>
          </div>
          <p class="credit">Astronomy Picture of the Day · NASA</p>
        </div>
      </footer>
    </div>

    <div class="widgets">
      <aside class="calendar" id="calendar" data-widget="calendar" aria-label="Calendar">
        <div class="calendar-head">
          <button class="calendar-nav" id="cal-prev" type="button" title="Previous month">←</button>
          <h2 class="calendar-title" id="cal-title">--</h2>
          <button class="calendar-nav" id="cal-next" type="button" title="Next month">→</button>
        </div>
        <div class="calendar-weekdays" id="cal-weekdays"></div>
        <div class="calendar-grid" id="cal-grid"></div>
      </aside>

      <aside class="weather" id="weather" data-widget="weather" aria-label="Weather">
        <button class="weather-city" id="weather-city" type="button" title="Set location">Set location</button>
        <form class="weather-edit" id="weather-edit" hidden>
          <input id="weather-input" type="text" placeholder="Search city..." autocomplete="off" maxlength="80" />
        </form>
        <div class="weather-main">
          <div class="weather-temp" id="weather-temp">--°</div>
          <div class="weather-icon" id="weather-icon"></div>
        </div>
        <div class="weather-desc" id="weather-desc">Click above to set your location</div>
        <div class="weather-meta" id="weather-meta"></div>
      </aside>

      <div class="todo" data-widget="todo">
        <h2 class="todo-title">Tasks</h2>
        <ul class="todo-list" id="todo-list"></ul>
        <form class="todo-add" id="todo-add">
          <input id="todo-input" type="text" placeholder="Add a task..." autocomplete="off" maxlength="120" />
        </form>
      </div>

      <div class="widgets-actions">
        <button class="widget-add-btn" id="widget-add-btn" type="button">＋ Add widgets</button>
        <button class="widget-edit-btn" id="widget-edit-btn" type="button" title="Edit widgets" aria-label="Edit widgets">✎</button>
      </div>
    </div>

    <div class="overlays">
      <div class="widget-card recents" data-widget="recents">
        <h2 class="widget-title">Recent Searches</h2>
        <ul class="recents-list" id="recents-list"></ul>
      </div>
      <div class="widget-card iss" data-widget="iss">
        <h2 class="widget-title">ISS Location</h2>
        <p class="iss-line" id="iss-loc">Tracking...</p>
        <p class="iss-coords" id="iss-coords"></p>
        <p class="moon" id="moon-phase"></p>
      </div>
      <div class="widget-card news" data-widget="news">
        <h2 class="widget-title">Space News</h2>
        <ul class="news-list" id="news-list"></ul>
      </div>
    </div>

    <div class="modal" id="widget-modal" hidden>
      <div class="modal-box widget-modal-box">
        <h2 id="widget-modal-title">Add widgets</h2>
        <div class="widget-picker" id="widget-picker"></div>
        <div class="modal-actions">
          <button type="button" id="widget-modal-close">Close</button>
        </div>
      </div>
    </div>

    <div class="modal" id="add-modal" hidden>
      <form class="modal-box" id="add-form">
        <h2>Add a quick link</h2>
        <input id="add-name" type="text" placeholder="Name" autocomplete="off" required />
        <input id="add-url" type="url" placeholder="https://example.com" required />
        <div class="modal-actions">
          <button type="button" id="add-cancel">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
